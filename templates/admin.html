<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | WEALTH sense</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .admin-container {
            max-width: 1000px;
            margin: 60px auto;
            padding: 40px;
            background: var(--bg-surface);
            border: 3px solid var(--border-color);
            box-shadow: 12px 12px 0 rgba(0,0,0,0.1);
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
            font-family: 'Arial', sans-serif;
        }
        .admin-table th, .admin-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        .admin-table th {
            background: var(--bg-main);
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
        }
        .admin-table tr:hover {
            background: rgba(0,0,0,0.02);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-box {
            padding: 20px;
            border: 1px solid var(--border-color);
            background: var(--bg-main);
        }
        .stat-val {
            font-size: 32px;
            font-family: 'Playfair Display';
            font-weight: 900;
        }
        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 800;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="newspaper-header" style="margin-bottom: 40px;">
            <h1 class="newspaper-title">ADMINISTRATOR EDITION</h1>
            <div class="dateline">
                <span>Central Intelligence Hub</span>
                <span id="headerDate"></span>
                <span>Top Secret</span>
            </div>
        </header>

        <div class="admin-container">
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">Total Registered Intelligence</div>
                    <div class="stat-val" id="totalUsers">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Total Portfolio Holdings</div>
                    <div class="stat-val" id="totalHoldings">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">System Status</div>
                    <div class="stat-val" style="color: var(--color-buy)">ACTIVE</div>
                </div>
            </div>

            <h2 style="font-family: 'Playfair Display'; border-bottom: 2px solid var(--border-color); padding-bottom: 10px;">User Directory</h2>
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>User Email</th>
                        <th>Joined Date</th>
                        <th>Holdings</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <!-- Data injected here -->
                </tbody>
            </table>
            
            <div style="margin-top: 40px; text-align: right;">
                <a href="/dashboard" class="premium-nav-link">Return to Dashboard</a>
            </div>
        </div>
    </div>

    <script src="/static/js/admin.js"></script>
</body>
</html>
